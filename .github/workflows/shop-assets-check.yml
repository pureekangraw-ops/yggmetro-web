name: Shop media validation
on:
  pull_request:
    paths:
      - 'public/assets/shop/**'
      - 'scripts/validate-shop-assets.py'
      - '.github/workflows/shop-assets-check.yml'
  push:
    branches: [main]
    paths:
      - 'public/assets/shop/**'
      - 'scripts/validate-shop-assets.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate-shop-assets.py
