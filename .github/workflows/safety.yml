name: YGG METRO Safety Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sales bridge regression tests
        run: npm test
      - name: Syntax check
        run: node --check src/index.js
      - name: Secret isolation check
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const source = fs.readFileSync("src/index.js","utf8");
          if (/OPENAI_API_KEY\s*[:=]\s*["']?sk-/.test(source)) {
            console.error("OpenAI secret-like literal detected");
            process.exit(1);
          }
          if (!source.includes("env.OPENAI_API_KEY")) {
            console.error("Server-side OPENAI_API_KEY binding is missing");
            process.exit(1);
          }
          if (!source.includes("api.openai.com/v1/responses")) {
            console.error("OpenAI Responses endpoint wiring is missing");
            process.exit(1);
          }
          console.log("Secret isolation checks passed.");
          NODE

