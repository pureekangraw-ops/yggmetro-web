name: METRO Android Build
on:
  pull_request:
    paths:
      - 'metro-android/**'
      - 'tests/metro-android.test.cjs'
      - '.github/workflows/metro-android-build.yml'
  push:
    branches: [main]
    paths:
      - 'metro-android/**'
      - 'tests/metro-android.test.cjs'
      - '.github/workflows/metro-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: metro-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        run: npx cap add android
      - name: Patch native floating bubble
        run: node scripts/install-bubble.mjs
      - name: Sync web assets
        run: npx cap sync android
      - name: Build installable debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: metro-android-${{ github.sha }}
          path: metro-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
