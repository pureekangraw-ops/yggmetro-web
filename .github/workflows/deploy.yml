name: YGG METRO Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run regression tests before deployment
        run: npm test
      - name: Check application syntax
        run: |
          node --check src/index.js
          node --check ygg-vault-android/www/app.js

  deploy:
    needs: safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Build without deployment credentials; deploy precisely these bytes below.
      - name: Prebuild Worker without credentials
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          ./node_modules/.bin/wrangler deploy --dry-run --outdir .deploy-build
          find .deploy-build public -type f -print0 | sort -z | xargs -0 sha256sum > .deploy-build.sha256
          sha256sum wrangler.jsonc >> .deploy-build.sha256

      - name: Deploy yggmetro-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        shell: bash
        run: |
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "::error::CLOUDFLARE_API_TOKEN is not available to yggmetro-web"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not available to yggmetro-web"; exit 1; }
          sha256sum --check .deploy-build.sha256
          ./node_modules/.bin/wrangler deploy .deploy-build/index.js --no-bundle

      - name: Resolve public smoke origin
        id: smoke_origin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;

          const subdomainRes = await fetch(
            "https://api.cloudflare.com/client/v4/accounts/" + accountId + "/workers/subdomain",
            { headers:{ authorization:"Bearer " + token } },
          );
          const subdomainPayload = await subdomainRes.json().catch(() => null);
          const subdomain = String(subdomainPayload?.result?.subdomain || "").trim();
          if (!subdomainRes.ok || subdomainPayload?.success !== true || !/^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/.test(subdomain)) {
            console.error("::error::Unable to resolve workers.dev subdomain.");
            process.exit(1);
          }

          const origin = "https://yggmetro-web." + subdomain + ".workers.dev";

          appendFileSync(process.env.GITHUB_OUTPUT, `origin=${origin}\n`);
          NODE

      - name: Verify production health and GO Client
        env:
          SMOKE_ORIGIN: ${{ steps.smoke_origin.outputs.origin }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const origin = process.env.SMOKE_ORIGIN;
          const healthRes = await fetch(origin + "/health", { headers:{ "cache-control":"no-cache" } });
          const health = await healthRes.json().catch(() => null);
          if (!healthRes.ok || health?.ok !== true || health?.service !== "yggmetro-web" || health?.spectrumSaleConfigured !== true) {
            console.error("::error::Production health failed or OPENAI_API_KEY binding is missing.");
            process.exit(1);
          }

          const clientRes = await fetch(origin + "/api/v1/interpret", {
            method:"POST",
            headers:{ "content-type":"application/json" },
            body:JSON.stringify({
              version:"1",
              text:"อยากทำ company profile ประมาณ 12 หน้า",
              context:{ surface:"SPECTRUMSALE", stage:"SALES" },
            }),
          });
          const client = await clientRes.json().catch(() => null);
          if (!clientRes.ok || client?.provider !== "openai" || typeof client?.intent !== "string") {
            console.error("::error::GO Client OpenAI smoke failed: " + String(client?.code || clientRes.status));
            process.exit(1);
          }

          console.log("YGG METRO production smoke passed: health + GO Client OpenAI.");
          NODE
